<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ფასების კატალოგი</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        #searchInput {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #searchInput::placeholder {
            color: #999;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .product-card h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.4;
            flex: 1;
        }

        .product-price {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
        }

        .product-price span {
            font-size: 20px;
            color: #666;
            margin-left: 5px;
        }

        .buy-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .buy-btn:hover {
            opacity: 0.9;
        }

        .buy-btn:active {
            transform: scale(0.98);
        }

        .no-results {
            text-align: center;
            color: white;
            font-size: 20px;
            padding: 40px;
        }

        .product-count {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .hidden {
            display: none;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .pagination button {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pagination button:hover:not(:disabled) {
            background: #667eea;
            color: white;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination button.active {
            background: #667eea;
            color: white;
            transform: scale(1.1);
        }

        .page-info {
            color: white;
            font-size: 14px;
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 32px;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }

            .search-box {
                flex-direction: column;
            }

            .pagination {
                gap: 5px;
            }

            .pagination button {
                padding: 8px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍷 ფასების კატალოგი</h1>
            <p>ღვინო, ლუდი, სპირტი</p>
        </header>

        <div class="search-box">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="🔍 ძებნა (მაგ: ღვინო, ლუდი...)"
            >
        </div>

        <div class="product-count">
            <span id="count">იტვირთება...</span>
        </div>

        <div class="products-grid" id="productsGrid"></div>

        <div class="no-results hidden" id="noResults">
            პროდუქტი ვერ მოიძებნა
        </div>

        <div class="pagination" id="pagination"></div>
        <div class="page-info" id="pageInfo"></div>
    </div>

    <script>
        const productsGrid = document.getElementById('productsGrid');
        const searchInput = document.getElementById('searchInput');
        const countSpan = document.getElementById('count');
        const noResults = document.getElementById('noResults');
        const paginationContainer = document.getElementById('pagination');
        const pageInfo = document.getElementById('pageInfo');

        const PRODUCTS_PER_PAGE = 8;

        let allProducts = [];
        let filteredProducts = [];
        let currentPage = 1;

        // 📥 Load JSON
        async function loadProducts() {
            try {
                const response = await fetch('/api/products.json');
                if (!response.ok) {
                    throw new Error('ფაილი ვერ ჩატვირთა');
                }
                allProducts = await response.json();
                console.log(`✅ ${allProducts.length} პროდუქტი ჩატვირთა`);
                filteredProducts = allProducts;
                renderPage();
            } catch (error) {
                console.error('Error:', error);
                productsGrid.innerHTML = '<div style="color: white; font-size: 18px;">❌ პროდუქტი ვერ ჩატვირთა. products.json ფაილი სწორ ადგილას არის?</div>';
            }
        }

        // 🎨 Display products for current page
        function renderPage() {
            productsGrid.innerHTML = '';

            if (filteredProducts.length === 0) {
                noResults.classList.remove('hidden');
                countSpan.textContent = '0 პროდუქტი';
                paginationContainer.innerHTML = '';
                pageInfo.innerHTML = '';
                return;
            }

            noResults.classList.add('hidden');
            countSpan.textContent = `${filteredProducts.length} პროდუქტი`;

            // Calculate pagination
            const totalPages = Math.ceil(filteredProducts.length / PRODUCTS_PER_PAGE);
            const startIndex = (currentPage - 1) * PRODUCTS_PER_PAGE;
            const endIndex = startIndex + PRODUCTS_PER_PAGE;
            const pageProducts = filteredProducts.slice(startIndex, endIndex);

            // Display products
            pageProducts.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <h3>${escapeHtml(product.title)}</h3>
                    <div class="product-price">
                        ${product.price}
                        <span>₾</span>
                    </div>
                    <a href="${product.full_url}" target="_blank" class="buy-btn">
                        ნახვა მაღაზიაში
                    </a>
                `;
                productsGrid.appendChild(card);
            });

            // Render pagination
            renderPagination(totalPages);

            // Update page info
            pageInfo.textContent = `გვერდი ${currentPage} / ${totalPages}`;
        }

        // 📄 Render pagination buttons
        function renderPagination(totalPages) {
            paginationContainer.innerHTML = '';

            if (totalPages <= 1) {
                pageInfo.innerHTML = '';
                return;
            }

            // Previous button
            const prevBtn = document.createElement('button');
            prevBtn.textContent = '← წინა';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderPage();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };
            paginationContainer.appendChild(prevBtn);

            // Page number buttons
            for (let i = 1; i <= totalPages; i++) {
                // Show first page, last page, and pages around current page
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    const pageBtn = document.createElement('button');
                    pageBtn.textContent = i;
                    pageBtn.className = currentPage === i ? 'active' : '';
                    pageBtn.onclick = () => {
                        currentPage = i;
                        renderPage();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    };
                    paginationContainer.appendChild(pageBtn);
                } else if (i === 2 || i === totalPages - 1) {
                    // Show dots for skipped pages
                    const dots = document.createElement('span');
                    dots.textContent = '...';
                    dots.style.color = 'white';
                    dots.style.padding = '0 5px';
                    paginationContainer.appendChild(dots);
                }
            }

            // Next button
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'შემდეგი →';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderPage();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };
            paginationContainer.appendChild(nextBtn);
        }

        // 🔍 Search
        function handleSearch() {
            const query = searchInput.value.toLowerCase();

            if (query === '') {
                filteredProducts = allProducts;
            } else {
                filteredProducts = allProducts.filter(product =>
                    product.title.toLowerCase().includes(query)
                );
            }

            currentPage = 1; // Reset to first page when searching
            renderPage();
        }

        // HTML escape
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        searchInput.addEventListener('input', handleSearch);

        // Load products on page load
        loadProducts();
    </script>
</body>
</html>
